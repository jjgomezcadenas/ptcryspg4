schema_version = 1

# Exact EXFOR quantity/data-type suffixes admitted by the first-pass curation.
# The target and residual are checked independently against the channel catalog.
accepted_reaction_suffixes = [
  ",,SIG",
  ",,SIG,,,EXP",
  ",IND,SIG,,,EXP",
]
accepted_energy_unit = "eV"
accepted_cross_section_unit = "b"

# EXFOR Formats/LEXFOR: SF8 modifier A means cross section multiplied by
# isotopic abundance. The CX4 values are therefore not direct absolute cross
# sections until that factor is recovered and verified from the source entry.
[dataset_override.exfor_B0077_002_p_C12_x_C11]
state = "pending"
reason_code = "abundance_weighted_quantity"
verification_basis = "EXFOR reaction SF8 contains A"
notes = "Resolve the abundance factor against Phys. Rev. 88 (1952) 739 before use."

