# Lowest energetically allowed production channel for each residual.
[threshold_MeV]
p_C12_x_C11 = 17.9
p_O16_x_O15 = 14.29
p_O16_x_C11 = 25.17
p_N14_x_N13 = 8.9
p_O16_x_N13 = 5.55

# Add entries only when a paper provides a separate numerical normalization
# uncertainty. Values are fractional one-standard-deviation uncertainties.
# A documented campaign anchors the fitted curve level at this precision
# (its campaign offset uses this value instead of the fitted global spread).
#
# Akagi 2013 (EXFOR E2449, ERR-ANALYS): ERR-1 proton number 3.4%,
# ERR-2 PET sensitivity 2.0%, ERR-3 target nuclei 2.2% (O targets) /
# 1.0% (C target), ERR-4 correction factor 2.0/0.2/0.4/0.2% for
# subentries 002/003/004/005. Values below are the quadrature sums.
[campaign_normalization_fraction]
exfor_E2449_002_p_O16_x_O15 = 0.049
# E2449_003 (Akagi O-16(p,x)C-11) carries no anchor: its level sits ~40%
# below the monitor-validated O2582 campaign and below every independent
# campaign in this channel, contradicting its documented 4.5% budget.  The
# points remain in the fit under the fitted campaign spread.  The Akagi
# anchors in the other channels agree with O2582 and stand.
exfor_E2449_004_p_O16_x_N13 = 0.045
exfor_E2449_005_p_C12_x_C11 = 0.041
# Rodriguez-Gonzalez 2023 (EXFOR O2582; Nucl. Data Sheets 187 (2023) 579,
# Sec. IV): PET spatial efficiency 3%, 22Na calibration source 1.5%, foil
# thickness 1%, beam current 1% (WPE) / <3% (HIT). Quadrature with the HIT
# beam current: 4.6%.
exfor_O2582_002_p_C12_x_C11 = 0.046
exfor_O2582_003_p_O16_x_C11 = 0.046
exfor_O2582_004_p_O16_x_N13 = 0.046
exfor_O2582_005_p_O16_x_O15 = 0.046
exfor_O2582_007_p_N14_x_N13 = 0.046
# Rodriguez-Gonzalez 2022 (EXFOR O2576, ERR-ANALYS): PET efficiency 2%,
# foil thickness 1%, current integrator 5%. Quadrature: 5.5%.
exfor_O2576_003_p_O16_x_C11 = 0.055
exfor_O2576_004_p_O16_x_N13 = 0.055

# Channels fitted in two joined segments: the campaign-offset model is
# applied separately below and above the boundary, and the curves are
# blended over [boundary, boundary + 2 MeV].  Used where a resonance region
# with large inter-campaign spread would otherwise set the plateau level.
[segment_boundary_MeV]
p_O16_x_N13 = 22.0

# Datasets listed in the same group receive one shared normalization draw.
[shared_normalization_group]
